openapi: 3.0.3
info:
  title: Nested Paths API
  version: 1.0.0
paths:
  /api/v1/users:
    get:
      tags:
        - users
      summary: List users
      description: List users
      operationId: listUsers
      responses:
        "200":
          description: list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nested_pathsUser"
  /api/v1/users/{id}:
    get:
      tags:
        - users
      summary: Get user by ID
      description: Get user by ID
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: user found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nested_pathsUser"
  /api/v1/users/{id}/orders:
    get:
      tags:
        - orders
      summary: List orders for user
      description: List orders for user
      operationId: listUserOrders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nested_pathsOrder"
  /api/v1/users/{id}/orders/{orderId}:
    get:
      tags:
        - orders
      summary: Get order
      description: Get order
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nested_pathsOrder"
  /api/v1/users/{id}/orders/{orderId}/items:
    get:
      tags:
        - orders
      summary: List order items
      description: List order items
      operationId: listOrderItems
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: order items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nested_pathsOrderItem"
components:
  schemas:
    Nested_pathsOrder:
      type: object
      properties:
        id:
          type: string
        total:
          type: integer
          format: int32
        user_id:
          type: string
    Nested_pathsOrderItem:
      type: object
      properties:
        id:
          type: string
        order_id:
          type: string
        product:
          type: string
        qty:
          type: integer
          format: int32
    Nested_pathsUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
