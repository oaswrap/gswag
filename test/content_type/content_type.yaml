openapi: 3.0.3
info:
  title: Content-Type API
  version: 1.0.0
paths:
  /report:
    get:
      tags:
        - report
      summary: Get report
      description: Get report
      operationId: getReport
      responses:
        '200':
          description: report data (CSV)
          content:
            application/json:
              schema: {}
            text/csv:
              schema: {}
  /upload:
    post:
      tags:
        - upload
      summary: Upload a file
      description: Upload a file
      operationId: uploadFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Content_typeUploadRequest'
      responses:
        '200':
          description: upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content_typeUploadResponse'
        '400':
          description: invalid content type
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas:
    Content_typeUploadRequest:
      type: object
      properties:
        filename:
          type: string
        size:
          type: integer
          format: int64
    Content_typeUploadResponse:
      type: object
      properties:
        filename:
          type: string
        id:
          type: string
        size:
          type: integer
          format: int64
