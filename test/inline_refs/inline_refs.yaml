openapi: 3.0.3
info:
  title: InlineRefs API
  version: 1.0.0
paths:
  /customers:
    get:
      tags:
        - customers
      summary: List customers
      description: List customers
      operationId: listCustomers
      responses:
        "200":
          description: list of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    address:
                      type: object
                      properties:
                        city:
                          type: string
                        country:
                          type: string
                        street:
                          type: string
                    contact:
                      type: object
                      properties:
                        email:
                          type: string
                        phone:
                          type: string
                    id:
                      type: integer
                      format: int32
                    name:
                      type: string
    post:
      tags:
        - customers
      summary: Create customer
      description: Create customer
      operationId: createCustomer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: object
                  properties:
                    city:
                      type: string
                    country:
                      type: string
                    street:
                      type: string
                contact:
                  type: object
                  properties:
                    email:
                      type: string
                    phone:
                      type: string
                id:
                  type: integer
                  format: int32
                name:
                  type: string
      responses:
        "201":
          description: customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: object
                    properties:
                      city:
                        type: string
                      country:
                        type: string
                      street:
                        type: string
                  contact:
                    type: object
                    properties:
                      email:
                        type: string
                      phone:
                        type: string
                  id:
                    type: integer
                    format: int32
                  name:
                    type: string
        "400":
          description: invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
