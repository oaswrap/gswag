openapi: 3.1.2
info:
  title: My API
  version: 1.0.0
paths:
  /basicdata:
    get:
      tags:
        - basicdata
      summary: get basic data types
      description: get basic data types
      operationId: get_basicdata
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllBasicDataTypes'
    post:
      tags:
        - basicdata
      summary: post basic data types
      description: post basic data types
      operationId: post_basicdata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllBasicDataTypes'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllBasicDataTypes'
        '400':
          description: invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /basicdata-pointers:
    get:
      tags:
        - basicdata
      summary: get basic data types with pointers
      description: get basic data types with pointers
      operationId: get_basicdata_pointers
