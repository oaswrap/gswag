          application/json:
            schema:
              $ref: '#/components/schemas/AllBasicDataTypesPointers'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllBasicDataTypesPointers'
