openapi: 3.0.3
info:
  title: Orders API (Chi)
  version: 1.0.0
paths:
  /orders:
    get:
      tags:
        - orders
      summary: List all orders
      description: List all orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiOrder"
      security:
        - apiKey: []
    post:
      tags:
        - orders
      summary: Place an order
      description: Place an order
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiCreateOrderRequest"
      responses:
        "201":
          description: order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOrder"
        "400":
          description: bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      security:
        - apiKey: []
  /orders/{id}:
    get:
      tags:
        - orders
      summary: Get order by ID
      description: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOrder"
        "404":
          description: order not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      security:
        - apiKey: []
    delete:
      tags:
        - orders
      summary: Cancel an order
      description: Cancel an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: order cancelled
      deprecated: true
      security:
        - apiKey: []
components:
  schemas:
    ApiCreateOrderRequest:
      type: object
      properties:
        product:
          type: string
        quantity:
          type: integer
          format: int32
    ApiOrder:
      type: object
      properties:
        id:
          type: string
        product:
          type: string
        quantity:
          type: integer
          format: int32
        total:
          type: number
          format: double
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
