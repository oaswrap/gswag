openapi: 3.1.2
info:
  title: Blog API (parallel)
  version: 1.0.0
paths:
  /api/posts:
    get:
      tags:
        - posts
      summary: List posts
      description: List posts
      responses:
        '200':
          description: list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    body:
                      type: string
                    id:
                      type: string
                    title:
                      type: string
                    user_id:
                      type: string
    post:
      tags:
        - posts
      summary: Create a post
      description: Create a post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                title:
                  type: string
                user_id:
                  type: string
      responses:
        '201':
          description: post created
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: string
                  id:
                    type: string
                  title:
                    type: string
                  user_id:
                    type: string
  /api/posts/{id}:
    get:
      tags:
        - posts
      summary: Get post by ID
      description: Get post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: post found
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: string
                  id:
                    type: string
                  title:
                    type: string
                  user_id:
                    type: string
        '404':
          description: post not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/users:
    get:
      tags:
        - users
      summary: List users
      description: List users
      responses:
        '200':
          description: list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    email:
                      type: string
                    id:
                      type: string
                    name:
                      type: string
    post:
      tags:
        - users
      summary: Create a user
      description: Create a user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: user created
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  id:
                    type: string
                  name:
                    type: string
  /api/users/{id}:
    get:
      tags:
        - users
      summary: Get user by ID
      description: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: user found
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  id:
                    type: string
                  name:
                    type: string
        '404':
          description: user not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
