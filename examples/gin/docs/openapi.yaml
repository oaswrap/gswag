openapi: 3.0.3
info:
  title: Items API (Gin)
  version: 1.0.0
paths:
  /items:
    get:
      tags:
        - items
      summary: List all items
      description: List all items
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: list of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiItem"
    post:
      tags:
        - items
      summary: Create an item
      description: Create an item
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiCreateItemRequest"
      responses:
        "201":
          description: item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiItem"
        "400":
          description: invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /items/{id}:
    get:
      tags:
        - items
      summary: Get item by ID
      description: Get item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: item found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiItem"
        "404":
          description: item not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      tags:
        - items
      summary: Delete an item
      description: Delete an item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: item deleted
components:
  schemas:
    ApiCreateItemRequest:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
          format: double
    ApiItem:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        price:
          type: number
          format: double
