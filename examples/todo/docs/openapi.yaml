openapi: 3.0.3
info:
  title: Todo API
  version: 1.0.0
paths:
  /todos:
    get:
      tags:
        - todos
      summary: List all todos
      description: List all todos
      responses:
        "200":
          description: list of todos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseTodoList"
              example:
                data: []
                message: ok
        "401":
          description: missing or invalid api key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: unauthorized
      security:
        - apiKey: []
    post:
      tags:
        - todos
      summary: Create a todo
      description: Create a todo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCreateTodoRequest"
            example:
              description: Milk, eggs, bread
              title: Buy groceries
      responses:
        "201":
          description: todo created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseTodo"
              example:
                data:
                  created_at: "2026-05-09T12:55:51.302276Z"
                  description: Milk, eggs, bread
                  done: false
                  id: 1.0
                  title: Buy groceries
                  updated_at: "2026-05-09T12:55:51.302276Z"
                message: created
        "400":
          description: missing or invalid body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: invalid character 'o' in literal null (expecting 'u')
        "401":
          description: missing or invalid api key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: unauthorized
      security:
        - apiKey: []
  /todos/{id}:
    get:
      tags:
        - todos
      summary: Get a todo by ID
      description: Get a todo by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: todo found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseTodo"
              example:
                data:
                  created_at: "2026-05-09T12:55:51.309015Z"
                  description: Milk and eggs
                  done: false
                  id: 1.0
                  title: Buy groceries
                  updated_at: "2026-05-09T12:55:51.309015Z"
                message: ok
        "401":
          description: missing or invalid api key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: unauthorized
        "404":
          description: todo not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: todo not found
      security:
        - apiKey: []
    put:
      tags:
        - todos
      summary: Update a todo
      description: Update a todo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpdateTodoRequest"
            example:
              description: Cover all endpoints and edge cases
              done: false
              title: Write tests (revised)
      responses:
        "200":
          description: todo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseTodo"
              example:
                data:
                  created_at: "2026-05-09T12:55:51.310756Z"
                  description: Cover all endpoints and edge cases
                  done: false
                  id: 1.0
                  title: Write tests (revised)
                  updated_at: "2026-05-09T12:55:51.311036Z"
                message: ok
        "400":
          description: missing or invalid body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: invalid character 'o' in literal null (expecting 'u')
        "401":
          description: missing or invalid api key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: unauthorized
        "404":
          description: todo not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: todo not found
      security:
        - apiKey: []
    delete:
      tags:
        - todos
      summary: Delete a todo
      description: Delete a todo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: todo deleted
        "401":
          description: missing or invalid api key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: unauthorized
        "404":
          description: todo not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: todo not found
      security:
        - apiKey: []
  /todos/{id}/done:
    patch:
      tags:
        - todos
      summary: Mark a todo as done
      description: Mark a todo as done
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: todo marked as done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseTodo"
              example:
                data:
                  created_at: "2026-05-09T12:55:51.304335Z"
                  description: Push to production
                  done: true
                  id: 1.0
                  title: Deploy service
                  updated_at: "2026-05-09T12:55:51.304795Z"
                message: ok
        "401":
          description: missing or invalid api key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: unauthorized
        "404":
          description: todo not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: todo not found
      security:
        - apiKey: []
components:
  schemas:
    ModelCreateTodoRequest:
      type: object
      properties:
        description:
          type: string
        title:
          type: string
    ModelTodo:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        description:
          type: string
        done:
          type: boolean
        id:
          type: integer
          format: int64
        title:
          type: string
        updated_at:
          type: string
          format: date-time
    ModelUpdateTodoRequest:
      type: object
      properties:
        description:
          type: string
        done:
          type: boolean
        title:
          type: string
    ResponseTodo:
      type: object
      properties:
        data:
          type: object
          properties:
            created_at:
              type: string
              format: date-time
            description:
              type: string
            done:
              type: boolean
            id:
              type: integer
              format: int64
            title:
              type: string
            updated_at:
              type: string
              format: date-time
        message:
          type: string
    ResponseTodoList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelTodo"
        message:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
